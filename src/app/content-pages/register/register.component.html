<div class="page auth">
  <div class="container">
    <form class="surface form-card fade-up" #f="ngForm" (ngSubmit)="submit(f)" novalidate>
      <h1>Create account</h1>
      <p class="lead-sm">Join us for faster checkout and order tracking.</p>

      <div class="form-group">
        <label for="name">Full name</label>
        <div class="input-icon">
          <i class="bi bi-person"></i>
          <input id="name" name="name" class="form-control" [(ngModel)]="name" #nm="ngModel" required
            [class.is-invalid]="nm.invalid && nm.touched" autocomplete="name" />
          <div class="invalid-feedback">Please enter your name.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-icon">
          <i class="bi bi-envelope"></i>
          <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" #em="ngModel" required email
            [class.is-invalid]="em.invalid && em.touched" autocomplete="email" />
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="pw">Password</label>
        <div class="input-icon">
          <i class="bi bi-lock"></i>
          <input id="pw" name="password" type="password" class="form-control" [(ngModel)]="password" #pw="ngModel" required
            minlength="8" [class.is-invalid]="pw.invalid && pw.touched" autocomplete="new-password" />
          <div class="invalid-feedback">Use at least 8 characters.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="cpw">Confirm password</label>
        <div class="input-icon">
          <i class="bi bi-shield-lock"></i>
          <input id="cpw" name="confirm" type="password" class="form-control" [(ngModel)]="confirm" #cp="ngModel" required
            [class.is-invalid]="cp.touched && (cp.invalid || confirm !== password)" autocomplete="new-password" />
          <div class="invalid-feedback">Passwords don't match.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">Create account</button>
      <p class="terms">By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      <p class="switch">Already have an account? <a routerLink="/log">Log in</a></p>
    </form>
  </div>
</div>
