<div class="page">
  <div class="container narrow">
    <div class="section-head">
      <div>
        <span class="eyebrow">Order tracking</span>
        <h1>Order #34VB5540K83</h1>
        <p>Expected delivery <strong class="text-body">{{ expected | date: 'EEE, d MMM' }}</strong></p>
      </div>
    </div>

    <div class="surface card-t">
      <div class="meta">
        <div><span>Shipped via</span><strong>India Post</strong></div>
        <div><span>Status</span><strong class="status">{{ steps[current].title }}</strong></div>
        <div><span>Items</span><strong>2</strong></div>
      </div>

      <ol class="timeline">
        <li *ngFor="let s of steps; let i = index" [class.done]="i < current" [class.now]="i === current">
          <div class="dot"><i class="bi" [ngClass]="i < current ? 'bi-check-lg' : s.icon"></i></div>
          <div class="txt">
            <strong>{{ s.title }}</strong>
            <span>{{ s.text }}</span>
          </div>
        </li>
      </ol>
    </div>

    <div class="foot">
      <div class="form-check form-switch">
        <input type="checkbox" class="form-check-input" id="notify" checked />
        <label class="form-check-label" for="notify">Notify me when my order is delivered</label>
      </div>
      <a routerLink="/contact" class="btn btn-outline-dark">Need help?</a>
    </div>
  </div>
</div>
