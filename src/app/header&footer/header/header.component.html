<header class="site-header" [class.scrolled]="scrolled">
  <div class="container bar">
    <a routerLink="/home" class="brand" (click)="menuOpen = false" aria-label="Ibn Anwaar home">
      <img src="assets/logo.png" alt="Ibn Anwaar" />
    </a>

    <nav class="nav-links" [class.open]="menuOpen" aria-label="Main">
      <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active" (click)="menuOpen = false">
        {{ link.label }}
      </a>
      <div class="mobile-auth">
        <a routerLink="/log" class="btn btn-outline-dark" (click)="menuOpen = false">Log in</a>
        <a routerLink="/register" class="btn btn-primary" (click)="menuOpen = false">Create account</a>
      </div>
    </nav>

    <div class="actions">
      <a routerLink="/log" class="auth-link">Log in</a>
      <a routerLink="/register" class="btn btn-primary btn-sm auth-cta">Sign up</a>
      <a routerLink="/addcart" class="cart" aria-label="Cart" (click)="menuOpen = false">
        <i class="bi bi-bag"></i>
        <span class="count" *ngIf="totalItem" [class.bump]="bump">{{ totalItem }}</span>
      </a>
      <button
        type="button"
        class="burger"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle menu"
      >
        <i class="bi" [ngClass]="menuOpen ? 'bi-x-lg' : 'bi-list'"></i>
      </button>
    </div>
  </div>
</header>
<div class="scrim" *ngIf="menuOpen" (click)="menuOpen = false"></div>
