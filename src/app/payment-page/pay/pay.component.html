<div class="page">
  <div class="container">
    <ol class="steps">
      <li class="done"><a routerLink="/addcart">Cart</a></li>
      <li class="done"><a routerLink="/cod">Delivery</a></li>
      <li class="on">Payment</li>
    </ol>

    <div class="checkout">
      <div class="surface panel">
        <h1>Payment</h1>
        <p class="text-muted mb-4"><i class="bi bi-lock-fill me-1"></i> All transactions are secure and encrypted.</p>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" [class.on]="tab === 'upi'" [attr.aria-selected]="tab === 'upi'" (click)="tab = 'upi'">
            <i class="bi bi-phone"></i> UPI
          </button>
          <button type="button" role="tab" [class.on]="tab === 'card'" [attr.aria-selected]="tab === 'card'" (click)="tab = 'card'">
            <i class="bi bi-credit-card"></i> Card
          </button>
        </div>

        <form *ngIf="tab === 'upi'" #u="ngForm" (ngSubmit)="submit(u)" novalidate>
          <div class="apps">
            <label *ngFor="let a of upiApps" class="method" [class.on]="upiApp === a.key">
              <input type="radio" name="upiApp" [value]="a.key" [(ngModel)]="upiApp" />
              <img [src]="a.logo" [alt]="" />
              <strong>{{ a.label }}</strong>
            </label>
          </div>

          <div class="form-group mt-4">
            <label for="upi">UPI ID</label>
            <input id="upi" name="upiId" class="form-control" placeholder="yourname@upi" [(ngModel)]="upiId" #ui="ngModel"
              required pattern="[\w.\-]+@[\w]+" [class.is-invalid]="ui.invalid && ui.touched" />
            <div class="invalid-feedback">Enter a valid UPI ID, like name&#64;okbank.</div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">Pay {{ total | currency: 'USD' }}</button>
        </form>

        <form *ngIf="tab === 'card'" #c="ngForm" (ngSubmit)="submit(c)" novalidate>
          <div class="form-group">
            <label for="cn">Name on card</label>
            <input id="cn" name="name" class="form-control" [(ngModel)]="card.name" #cn="ngModel" required
              [class.is-invalid]="cn.invalid && cn.touched" autocomplete="cc-name" />
            <div class="invalid-feedback">Please enter the name on the card.</div>
          </div>

          <div class="form-group">
            <label for="num">Card number</label>
            <div class="input-icon">
              <i class="bi bi-credit-card-2-front"></i>
              <input id="num" name="number" class="form-control" inputmode="numeric" placeholder="1234 5678 9012 3456"
                [(ngModel)]="card.number" (input)="formatCard()" #num="ngModel" required pattern="(\d{4} ){3}\d{4}"
                [class.is-invalid]="num.invalid && num.touched" autocomplete="cc-number" />
              <div class="invalid-feedback">Enter a 16-digit card number.</div>
            </div>
          </div>

          <div class="row gx-3">
            <div class="form-group col-6">
              <label for="exp">Expiry</label>
              <input id="exp" name="exp" class="form-control" placeholder="MM/YY" [(ngModel)]="card.exp" #exp="ngModel"
                required pattern="(0[1-9]|1[0-2])\/\d{2}" [class.is-invalid]="exp.invalid && exp.touched" autocomplete="cc-exp" />
              <div class="invalid-feedback">Use MM/YY.</div>
            </div>
            <div class="form-group col-6">
              <label for="cvv">CVV</label>
              <input id="cvv" name="cvv" type="password" inputmode="numeric" class="form-control" placeholder="•••"
                [(ngModel)]="card.cvv" #cvv="ngModel" required pattern="\d{3,4}"
                [class.is-invalid]="cvv.invalid && cvv.touched" autocomplete="cc-csc" />
              <div class="invalid-feedback">3 or 4 digits.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Pay {{ total | currency: 'USD' }}</button>
        </form>
      </div>

      <app-mini-summary></app-mini-summary>
    </div>
  </div>
</div>
